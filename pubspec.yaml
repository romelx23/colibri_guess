name: ingresa_ya
description: "Ingresa Ya - App de cultura general con retroalimentación estilo Duolingo, guiada por el colibrí"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  shared_preferences: ^2.5.6
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
